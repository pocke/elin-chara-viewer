x-toolchain: &toolchain
  build: .
  image: elin-chara-viewer-dev
  user: '1000:1000'
  working_dir: /app
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment:
    ELIN_DEV_CONTAINER: '1'

services:
  # Adding a file the host runs or reads as configuration means adding it to
  # the read-only mounts below. CI checks that this list still covers them.
  app:
    <<: *toolchain
    command: npm run dev
    ports:
      # The HMR client connects to the port the browser sees, so the two sides
      # have to name the same one.
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm-cache:/npm-cache
      - ./.git:/app/.git:ro
      - ./.claude:/app/.claude:ro
      - ./.github:/app/.github:ro
      # bundler evaluates .ruby-lsp/Gemfile on the host, and its own .gitignore
      # keeps everything under it out of `git status`.
      - ./.ruby-lsp:/app/.ruby-lsp:ro
      # Holds the Elin-Decompiled clone that extract_feat.rb runs git against
      # on the host, where a written .git/config is enough to run a command.
      - ./tmp:/app/tmp:ro
      # A read-only file can still be replaced by renaming the directory it
      # sits in, so the .rb and .sh files here are covered by the directory
      # rather than one by one. Mount points cannot be renamed.
      - ./script:/app/script:ro
      - ./script/build-history.ts:/app/script/build-history.ts
      - ./script/check-archive.ts:/app/script/check-archive.ts
      - ./script/check-export.ts:/app/script/check-export.ts
      - ./script/check-history-provenance.ts:/app/script/check-history-provenance.ts
      - ./script/copy-csv.cjs:/app/script/copy-csv.cjs
      - ./compose.yaml:/app/compose.yaml:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./.dockerignore:/app/.dockerignore:ro
      - ./.env:/app/.env:ro
      - ./CLAUDE.md:/app/CLAUDE.md:ro
      - ./update.sh:/app/update.sh:ro
      - ./wrangler.toml:/app/wrangler.toml:ro

  # `npm ci` runs here rather than in app: update.sh commits and merges the
  # working tree right after installing.
  check:
    <<: *toolchain
    # Keeps `docker compose up` from starting it; `docker compose run` enables
    # the profile on its own.
    profiles:
      - check
    volumes:
      - .:/app:ro
      - node_modules:/app/node_modules
      - npm-cache:/npm-cache

volumes:
  node_modules:
  npm-cache:
